  <style>
    .dark { --bg-base: #0e1c2f; --bg-card: #162b47; --bg-elevated: #1e3a5f; --border-subtle: #2e4a6f; --text-primary: #f0f4fa; --text-secondary: #b8c9dd; }
    .light { --bg-base: #f4f8fc; --bg-card: #ffffff; --bg-elevated: #eaf1f8; --border-subtle: #c8d6e8; --text-primary: #0e1c2f; --text-secondary: #3d5a7a; }
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #1a76d0; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #155ea8; }
    .blog-content h2 { font-size: 1.875rem; font-weight: 700; margin-top: 2.5rem; margin-bottom: 1rem; padding-bottom: 0.5rem; border-bottom: 2px solid #e2e8f0; }
    .dark .blog-content h2 { border-color: #2e4a6f; }
    .blog-content h3 { font-size: 1.5rem; font-weight: 600; margin-top: 2rem; margin-bottom: 0.75rem; color: #1a76d0; }
    .dark .blog-content h3 { color: #72ace2; }
    .blog-content p { font-size: 1.125rem; line-height: 1.75; margin-bottom: 1.25rem; color: #2e4a6f; }
    .dark .blog-content p { color: #b8c9dd; }
    .blog-content strong { color: #0e1c2f; font-weight: 700; }
    .dark .blog-content strong { color: #f0f4fa; }
    .blog-content table { width: 100%; border-collapse: collapse; margin: 1.5rem 0; border-radius: 0.5rem; overflow: hidden; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
    .blog-content th { background: linear-gradient(to right, #1e3a5f, #1a76d0); color: white; padding: 1rem; text-align: left; font-weight: 600; }
    .blog-content td { padding: 1rem; border-bottom: 1px solid #d0e3f5; background: white; }
    .dark .blog-content td { background: #162b47; border-color: #2e4a6f; }
    .blog-content tr:hover td { background: #eaf1f8; }
    .dark .blog-content tr:hover td { background: #2e4a6f; }
    .blog-content blockquote { border-left: 4px solid #1a76d0; padding: 1rem 1.5rem; margin: 1.5rem 0; background: #eaf1f8; font-style: italic; border-radius: 0 0.5rem 0.5rem 0; }
    .dark .blog-content blockquote { background: #1e3a5f; }
    .blog-content ul, .blog-content ol { padding-left: 1.5rem; margin-bottom: 1.25rem; }
    .blog-content li { margin-bottom: 0.5rem; color: #2e4a6f; }
    .dark .blog-content li { color: #b8c9dd; }
    .blog-content code { background: #eaf1f8; padding: 0.25rem 0.5rem; border-radius: 0.25rem; font-family: 'Courier New', monospace; font-size: 0.875rem; color: #c0392b; }
    .dark .blog-content code { background: #2e4a6f; color: #f1948a; }
    .blog-content pre { background: #0e1c2f; color: #eaf1f8; padding: 1.5rem; border-radius: 0.75rem; overflow-x: auto; margin: 1.5rem 0; }
    .blog-content pre code { background: transparent; color: inherit; padding: 0; }
    .blog-content hr { margin: 2.5rem 0; border: 0; height: 2px; background: linear-gradient(to right, transparent, #1a76d0, transparent); }
    .blog-content a { color: #1a76d0; text-decoration: underline; }
    .dark .blog-content a { color: #72ace2; }
    .blog-content img { max-width: 100%; border-radius: 0.75rem; margin: 1.5rem 0; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); }
    @keyframes fadeIn { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }
    .animate-fade-in { animation: fadeIn 0.6s ease-out forwards; }
    .glass { background: rgba(255,255,255,0.75); backdrop-filter: blur(14px); border-bottom: 1px solid rgba(255,255,255,0.2); }
    .dark .glass { background: rgba(14,28,47,0.85); border-bottom: 1px solid rgba(255,255,255,0.05); }
    .gradient-text { background: linear-gradient(135deg, #1e3a5f, #1a76d0, #43a1e0); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .blog-card { transition: all 0.3s ease; }
    .blog-card:hover { transform: translateY(-8px); box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1), 0 10px 10px -5px rgba(0,0,0,0.04); }
    .skeleton { background: linear-gradient(90deg, #d0e3f5 25%, #eaf1f8 50%, #d0e3f5 75%); background-size: 200% 100%; animation: skeleton 1.5s infinite; }
    .dark .skeleton { background: linear-gradient(90deg, #2e4a6f 25%, #4a6a8f 50%, #2e4a6f 75%); background-size: 200% 100%; }
    @keyframes skeleton { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
    .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .line-clamp-3 { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .dropdown-menu { transform-origin: top right; transition: all 0.15s ease-out; }
    .dropdown-menu.hidden { opacity: 0; transform: scale(0.95); pointer-events: none; }
    .dropdown-menu:not(.hidden) { opacity: 1; transform: scale(1); pointer-events: auto; }
    .stat-card { transition: all 0.2s ease; }
    .stat-card:hover { transform: translateY(-4px); }
    .dashboard-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px,1fr)); gap:1.5rem; }
    .feature-card { transition: all 0.3s ease; }
    .feature-card:hover { transform: translateY(-6px); }
    @keyframes pulse-stream { 0%,100%{ opacity:1; } 50%{ opacity:0.5; } }
    .streaming-pulse { animation: pulse-stream 1.2s ease-in-out infinite; }
    .preview-scroll::-webkit-scrollbar { width: 4px; }
    .preview-scroll::-webkit-scrollbar-thumb { background: #1a76d0; border-radius: 8px; }
    /* hide editor and preview */
    .hidden-editor, .editor-section, .preview-section { display: none !important; }
    .create-blog .editor-area { display: none; }
    .create-blog .preview-area { display: none; }

  <div id="auth-modal" class="fixed inset-0 z-[60] hidden">
    <div class="absolute inset-0 bg-black/50 backdrop-blur-sm" onclick="closeAuthModal()"></div>

      <div class="bg-white dark:bg-[#162b47] rounded-2xl shadow-2xl w-full max-w-md p-8 transform transition-all border border-slate-200 dark:border-[#2e4a6f]">

        </div>
        <form id="auth-form" onsubmit="handleAuthSubmit(event)">

              <div><label class="block text-sm font-medium mb-1">First Name</label><input type="text" name="first_name" class="w-full px-4 py-2 rounded-lg border border-slate-300 dark:border-[#2e4a6f] bg-white dark:bg-[#1e3a5f] focus:ring-2 focus:ring-[#1a76d0] outline-none transition-all"></div>
              <div><label class="block text-sm font-medium mb-1">Last Name</label><input type="text" name="last_name" class="w-full px-4 py-2 rounded-lg border border-slate-300 dark:border-[#2e4a6f] bg-white dark:bg-[#1e3a5f] focus:ring-2 focus:ring-[#1a76d0] outline-none transition-all"></div>
            </div>
            <div><label class="block text-sm font-medium mb-1">Username</label><input type="text" name="username" class="w-full px-4 py-2 rounded-lg border border-slate-300 dark:border-[#2e4a6f] bg-white dark:bg-[#1e3a5f] focus:ring-2 focus:ring-[#1a76d0] outline-none transition-all"></div>
          </div>
          <div class="space-y-4 mt-4">
            <div><label class="block text-sm font-medium mb-1">Email</label><input type="email" name="email" required class="w-full px-4 py-2 rounded-lg border border-slate-300 dark:border-[#2e4a6f] bg-white dark:bg-[#1e3a5f] focus:ring-2 focus:ring-[#1a76d0] outline-none transition-all"></div>
            <div><label class="block text-sm font-medium mb-1">Password</label><input type="password" name="password" required class="w-full px-4 py-2 rounded-lg border border-slate-300 dark:border-[#2e4a6f] bg-white dark:bg-[#1e3a5f] focus:ring-2 focus:ring-[#1a76d0] outline-none transition-all"></div>

          <button type="submit" id="auth-submit-btn" class="w-full mt-6 py-3 rounded-lg bg-gradient-to-r from-[#1e3a5f] to-[#1a76d0] text-white font-semibold hover:shadow-lg transform hover:-translate-y-0.5 transition-all">Login</button>

          <button onclick="toggleAuthMode()" class="text-[#1a76d0] hover:text-[#155ea8] font-medium ml-1"><span id="auth-toggle-btn">Register</span></button>
        </p>

  <script>
    const API_URL = 'http://127.0.0.1:8000';
    const DEFAULT_BLOG_IMAGE = 'https://res.cloudinary.com/vebwwyza/image/upload/v1787654759/gpg2hwbiespnrovxtcai.jpg';

    let state = {
      user: null,
      token: localStorage.getItem('blog_token'),
      blogs: [],
      theme: localStorage.getItem('blog_theme') || 'dark',
      authMode: 'login',
      loading: false,
      userMenuOpen: false
    };

    function generateAIImageStream(text, callback) {
      const words = text.trim().split(/\s+/).length;
      if (words < 5) { callback(DEFAULT_BLOG_IMAGE); return; }
      const seed = text.length % 100;
      const baseUrl = 'https://picsum.photos/seed/' + seed + '/800/400';
      let count = 0;
      const interval = setInterval(() => {
        count++;
        if (count === 1) callback('https://picsum.photos/seed/' + (seed + 1) + '/800/400?random=1');
        else if (count === 2) callback('https://picsum.photos/seed/' + (seed + 2) + '/800/400?random=2');
        else { clearInterval(interval); callback(baseUrl); }
      }, 400);
      setTimeout(() => clearInterval(interval), 3000);
    }

    document.addEventListener('DOMContentLoaded', () => {
      initTheme();
      if (state.token) fetchCurrentUser();
      fetchBlogs();
      handleRoute();
      window.addEventListener('hashchange', handleRoute);
      document.addEventListener('click', (e) => {
        const menu = document.getElementById('user-dropdown');
        const btn = document.getElementById('user-menu-btn');
        if (menu && !menu.contains(e.target) && btn && !btn.contains(e.target)) {
          menu.classList.add('hidden'); state.userMenuOpen = false;
        }
      });
    });

    function initTheme() {
      if (state.theme === 'dark') { document.documentElement.classList.add('dark'); document.documentElement.classList.remove('light'); }
      else { document.documentElement.classList.remove('dark'); document.documentElement.classList.add('light'); }
    }
    function toggleTheme() {
      state.theme = state.theme === 'dark' ? 'light' : 'dark';
      localStorage.setItem('blog_theme', state.theme);
      initTheme();
    }
    function navigateTo(route) { window.location.hash = route; }

    function handleRoute() {
      const hash = window.location.hash.slice(1) || '';
      const [route, ...params] = hash.split('/');
      const app = document.getElementById('app');
      window.scrollTo(0, 0);
      document.querySelectorAll('.nav-link').forEach(link => {
        link.classList.remove('text-[#1a76d0]');
        const href = link.getAttribute('href');
        if ((route === '' && (href === '#' || href === '')) || href === '#' + route) link.classList.add('text-[#1a76d0]');
      });
      if (route === 'blog' && params[0]) renderSingleBlog(parseInt(params[0]), app);
      else if (route === 'my-blogs') renderMyBlogs(app);
      else if (route === 'about') renderAbout(app);
      else if (route === 'profile') renderProfile(app);
      else if (route === 'dashboard') renderDashboard(app);
      else if (route === 'create-blog') renderCreateBlog(app);
      else renderAllBlogs(app);
    }

    async function fetchBlogs() {
      state.loading = true;
      try {
        const res = await fetch(`${API_URL}/blogs/`);
        if (!res.ok) throw new Error('Failed');
        const data = await res.json();
        state.blogs = Array.isArray(data) ? data : (Array.isArray(data[0]) ? data[0] : []);
      } catch (err) {
        console.error('Error fetching blogs:', err);
        state.blogs = getDemoBlogs();
      }
      state.loading = false;
      const hash = window.location.hash.slice(1) || '';
      if (!hash || hash === 'blogs' || hash === 'my-blogs' || hash === 'profile' || hash === 'dashboard') handleRoute();
    }

    async function fetchCurrentUser() {
      try {
        const res = await fetch(`${API_URL}/users/me`, { headers: { 'Authorization': `Bearer ${state.token}` } });
        if (res.ok) { state.user = await res.json(); updateAuthUI(); } else logout();
      } catch (err) { console.error(err); }
    }

    async function handleAuthSubmit(e) {
      e.preventDefault();
      const form = e.target;
      const data = Object.fromEntries(new FormData(form));
      try {
        if (state.authMode === 'login') {
          const res = await fetch(`${API_URL}/users/login`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: data.email, password: data.password })
          });
          if (!res.ok) { const err = await res.json(); throw new Error(err.detail || 'Login failed'); }
          const result = await res.json();
          state.token = result.access_token;
          localStorage.setItem('blog_token', state.token);
          await fetchCurrentUser();
          closeAuthModal();
          showToast('Welcome back!', 'success');
          handleRoute();
        } else {
          const res = await fetch(`${API_URL}/users/create`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
          });
          if (!res.ok) { const err = await res.json(); throw new Error(err.detail || 'Registration failed'); }
          showToast('Account created! Please login.', 'success');
          toggleAuthMode();
        }
      } catch (err) { showToast(err.message, 'error'); }
    }

    async function createBlog(blogData) {
      try {
        const res = await fetch(`${API_URL}/blogs/`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${state.token}` },
          body: JSON.stringify(blogData)
        });
        if (!res.ok) { const err = await res.json(); throw new Error(err.detail || 'Failed'); }
        showToast('Blog published!', 'success');
        await fetchBlogs();
        navigateTo('my-blogs');
      } catch (err) { showToast(err.message, 'error'); }
    }

    function logout() {
      state.user = null; state.token = null; localStorage.removeItem('blog_token');
      updateAuthUI(); showToast('Logged out', 'info');
      const hash = window.location.hash.slice(1) || '';
      if (hash === 'my-blogs' || hash === 'profile' || hash === 'create-blog' || hash === 'dashboard') navigateTo('');
    }

    function updateAuthUI() {
      const container = document.getElementById('auth-section');
      const mobileAuth = document.getElementById('mobile-auth-links');
      if (state.user) {
        const initials = getInitials(state.user.first_name, state.user.last_name) || 'SA';
        const name = state.user.first_name || state.user.username;
        container.innerHTML = `
          <div class="relative">
            <button id="user-menu-btn" onclick="toggleUserMenu()" class="flex items-center space-x-2 focus:outline-none p-1 rounded-lg hover:bg-slate-200 dark:hover:bg-[#1e3a5f] transition-colors">
              <div class="w-8 h-8 rounded-full bg-gradient-to-br from-[#1e3a5f] to-[#1a76d0] flex items-center justify-center text-white font-bold text-sm shadow-md">${initials}</div>
              <span class="hidden sm:block text-sm font-medium">${name}</span>
              <i class="fas fa-chevron-down text-xs text-slate-400"></i>
            </button>
            <div id="user-dropdown" class="dropdown-menu hidden absolute right-0 mt-2 w-52 bg-white dark:bg-[#162b47] rounded-xl shadow-2xl border border-slate-200 dark:border-[#2e4a6f] py-2 z-50">
              <div class="px-4 py-2 border-b border-slate-100 dark:border-[#2e4a6f] mb-1">

    function handleCreateBlog(e) {
      e.preventDefault();
      const form = e.target;

        return;

      if (!data.image_url || data.image_url.trim() === '') data.image_url = DEFAULT_BLOG_IMAGE;
      createBlog(data);
    }
