<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sudais Azlan - AI Blog Agent</title>
    <script src="https://cdn.tailwindcss.com">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js">
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Playfair Display', 'serif'],
                    },
                    colors: {
                        primary: {
                            50: '#f0fdfa',
                            100: '#ccfbf1',
                            200: '#99f6e4',
                            300: '#5eead4',
                            400: '#2dd4bf',
                            500: '#14b8a6',
                            600: '#0d9488',
                            700: '#0f766e',
                            800: '#115e59',
                            900: '#134e4a',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #0d9488;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #0f766e;
        }

        .blog-content h2 {
            font-size: 1.875rem;
            font-weight: 700;
            margin-top: 2.5rem;
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 2px solid #e2e8f0;
        }
        .dark .blog-content h2 {
            border-color: #334155;
        }
        .blog-content h3 {
            font-size: 1.5rem;
            font-weight: 600;
            margin-top: 2rem;
            margin-bottom: 0.75rem;
            color: #0f766e;
        }
        .dark .blog-content h3 {
            color: #2dd4bf;
        }
        .blog-content p {
            font-size: 1.125rem;
            line-height: 1.75;
            margin-bottom: 1.25rem;
            color: #475569;
        }
        .dark .blog-content p {
            color: #94a3b8;
        }
        .blog-content strong {
            color: #0f172a;
            font-weight: 700;
        }
        .dark .blog-content strong {
            color: #f1f5f9;
        }
        .blog-content table {
            width: 100%;
            border-collapse: collapse;
            margin: 1.5rem 0;
            border-radius: 0.5rem;
            overflow: hidden;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .blog-content th {
            background: linear-gradient(to right, #0f766e, #059669);
            color: white;
            padding: 1rem;
            text-align: left;
            font-weight: 600;
        }
        .blog-content td {
            padding: 1rem;
            border-bottom: 1px solid #e2e8f0;
            background: white;
        }
        .dark .blog-content td {
            background: #1e293b;
            border-color: #334155;
        }
        .blog-content tr:hover td {
            background: #f8fafc;
        }
        .dark .blog-content tr:hover td {
            background: #334155;
        }
        .blog-content blockquote {
            border-left: 4px solid #0d9488;
            padding: 1rem 1.5rem;
            margin: 1.5rem 0;
            background: #f8fafc;
            font-style: italic;
            border-radius: 0 0.5rem 0.5rem 0;
        }
        .dark .blog-content blockquote {
            background: #1e293b;
        }
        .blog-content ul,
        .blog-content ol {
            padding-left: 1.5rem;
            margin-bottom: 1.25rem;
        }
        .blog-content li {
            margin-bottom: 0.5rem;
            color: #475569;
        }
        .dark .blog-content li {
            color: #94a3b8;
        }
        .blog-content code {
            background: #f1f5f9;
            padding: 0.25rem 0.5rem;
            border-radius: 0.25rem;
            font-family: 'Courier New', monospace;
            font-size: 0.875rem;
            color: #dc2626;
        }
        .dark .blog-content code {
            background: #334155;
            color: #f87171;
        }
        .blog-content pre {
            background: #0f172a;
            color: #e2e8f0;
            padding: 1.5rem;
            border-radius: 0.75rem;
            overflow-x: auto;
            margin: 1.5rem 0;
        }
        .blog-content pre code {
            background: transparent;
            color: inherit;
            padding: 0;
        }
        .blog-content hr {
            margin: 2.5rem 0;
            border: 0;
            height: 2px;
            background: linear-gradient(to right, transparent, #0d9488, transparent);
        }
        .blog-content a {
            color: #0f766e;
            text-decoration: underline;
        }
        .dark .blog-content a {
            color: #2dd4bf;
        }
        .blog-content img {
            max-width: 100%;
            border-radius: 0.75rem;
            margin: 1.5rem 0;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .animate-fade-in {
            animation: fadeIn 0.6s ease-out forwards;
        }

        .glass {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.3);
        }
        .dark .glass {
            background: rgba(15, 23, 42, 0.7);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .gradient-text {
            background: linear-gradient(135deg, #0d9488, #059669, #10b981);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .blog-card {
            transition: all 0.3s ease;
        }
        .blog-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }

        .skeleton {
            background: linear-gradient(90deg, #e2e8f0 25%, #f1f5f9 50%, #e2e8f0 75%);
            background-size: 200% 100%;
            animation: skeleton 1.5s infinite;
        }
        .dark .skeleton {
            background: linear-gradient(90deg, #334155 25%, #475569 50%, #334155 75%);
            background-size: 200% 100%;
        }
        @keyframes skeleton {
            0% {
                background-position: 200% 0;
            }
            100% {
                background-position: -200% 0;
            }
        }

        .line-clamp-2 {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .line-clamp-3 {
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .dropdown-menu {
            transform-origin: top right;
            transition: all 0.15s ease-out;
        }
        .dropdown-menu.hidden {
            opacity: 0;
            transform: scale(0.95);
            pointer-events: none;
        }
        .dropdown-menu:not(.hidden) {
            opacity: 1;
            transform: scale(1);
            pointer-events: auto;
        }

        .editor-textarea {
            font-family: 'Courier New', monospace;
            line-height: 1.6;
        }

        .stat-card {
            transition: all 0.2s ease;
        }
        .stat-card:hover {
            transform: translateY(-4px);
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
        }
    </style>
    <base target="_blank">
</head>

    <div id="auth-modal" class="fixed inset-0 z-[60] hidden">
        <div class="absolute inset-0 bg-black/50 backdrop-blur-sm" onclick="closeAuthModal()"></div>
        <div class="relative min-h-screen flex items-center justify-center p-4">
            <div class="bg-white dark:bg-slate-800 rounded-2xl shadow-2xl w-full max-w-md p-8 transform transition-all">
                <div class="flex justify-between items-center mb-6">
                    <h2 id="auth-title" class="text-2xl font-bold gradient-text">Login</h2>
                    <button onclick="closeAuthModal()" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200"><i class="fas fa-times text-xl"></i></button>
                </div>
                <form id="auth-form" onsubmit="handleAuthSubmit(event)">
                    <div id="register-fields" class="hidden space-y-4">
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-medium mb-1">First Name</label>
                                <input type="text" name="first_name" class="w-full px-4 py-2 rounded-lg border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-700 focus:ring-2 focus:ring-teal-500 outline-none transition-all">
                            </div>
                            <div>
                                <label class="block text-sm font-medium mb-1">Last Name</label>
                                <input type="text" name="last_name" class="w-full px-4 py-2 rounded-lg border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-700 focus:ring-2 focus:ring-teal-500 outline-none transition-all">
                            </div>
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-1">Username</label>
                            <input type="text" name="username" class="w-full px-4 py-2 rounded-lg border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-700 focus:ring-2 focus:ring-teal-500 outline-none transition-all">
                        </div>
                    </div>
                    <div class="space-y-4 mt-4">
                        <div>
                            <label class="block text-sm font-medium mb-1">Email</label>
                            <input type="email" name="email" required class="w-full px-4 py-2 rounded-lg border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-700 focus:ring-2 focus:ring-teal-500 outline-none transition-all">
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-1">Password</label>
                            <input type="password" name="password" required class="w-full px-4 py-2 rounded-lg border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-700 focus:ring-2 focus:ring-teal-500 outline-none transition-all">
                        </div>
                    </div>
                    <button type="submit" id="auth-submit-btn" class="w-full mt-6 py-3 rounded-lg bg-gradient-to-r from-teal-600 to-emerald-600 text-white font-semibold hover:shadow-lg transform hover:-translate-y-0.5 transition-all">Login</button>

                <p class="mt-4 text-center text-sm text-slate-500 dark:text-slate-400">
                    <span id="auth-toggle-text">Don't have an account?</span>
                    <button onclick="toggleAuthMode()" class="text-teal-600 hover:text-teal-500 font-medium ml-1"><span id="auth-toggle-btn">Register</span></button>
                </p>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'http://127.0.0.1:8000';
        const DEFAULT_BLOG_IMAGE =
            'https://res.cloudinary.com/vebwwyza/image/upload/v1787654759/gpg2hwbiespnrovxtcai.jpg';

        let state = {
            user: null,
            token: localStorage.getItem('blog_token'),
            blogs: [],
            theme: localStorage.getItem('blog_theme') || 'dark',
            authMode: 'login',
            loading: false,
            userMenuOpen: false
        };

        document.addEventListener('DOMContentLoaded', () => {
            initTheme();
            if (state.token) fetchCurrentUser();
            fetchBlogs();
            handleRoute();
            window.addEventListener('hashchange', handleRoute);
            document.addEventListener('click', (e) => {
                const menu = document.getElementById('user-dropdown');
                const btn = document.getElementById('user-menu-btn');
                if (menu && !menu.contains(e.target) && btn && !btn.contains(e.target)) {
                    menu.classList.add('hidden');
                    state.userMenuOpen = false;
                }
            });
        });

        function initTheme() {
            if (state.theme === 'dark') document.documentElement.classList.add('dark');
            else document.documentElement.classList.remove('dark');
        }

        function toggleTheme() {
            state.theme = state.theme === 'dark' ? 'light' : 'dark';
            localStorage.setItem('blog_theme', state.theme);
            initTheme();
        }

        function navigateTo(route) { window.location.hash = route; }

        function handleRoute() {
            const hash = window.location.hash.slice(1) || '';
            const [route, ...params] = hash.split('/');
            const app = document.getElementById('app');
            window.scrollTo(0, 0);
            document.querySelectorAll('.nav-link').forEach(link => {
                link.classList.remove('text-teal-600');
                const href = link.getAttribute('href');
                if ((route === '' && (href === '#' || href === '')) || href === '#' + route) link.classList.add(
                    'text-teal-600');
            });
            if (route === 'blog' && params[0]) renderSingleBlog(parseInt(params[0]), app);
            else if (route === 'my-blogs') renderMyBlogs(app);
            else if (route === 'about') renderAbout(app);
            else if (route === 'profile') renderProfile(app);
            else if (route === 'dashboard') renderDashboard(app);
            else if (route === 'create-blog') renderCreateBlog(app);
            else renderAllBlogs(app);
        }

        async function fetchBlogs() {
            state.loading = true;
            try {
                const res = await fetch(`${API_URL}/blogs/`);
                if (!res.ok) throw new Error('Failed to fetch blogs');
                const data = await res.json();
                state.blogs = Array.isArray(data) ? data : (Array.isArray(data[0]) ? data[0] : []);
            } catch (err) {
                console.error('Error fetching blogs:', err);
                showToast('Backend not connected - showing demo data', 'info');
                state.blogs = getDemoBlogs();
            }
            state.loading = false;
            const hash = window.location.hash.slice(1) || '';
            if (!hash || hash === 'blogs' || hash === 'my-blogs' || hash === 'profile' || hash === 'dashboard')
                handleRoute();
        }

        async function fetchCurrentUser() {
            try {
                const res = await fetch(`${API_URL}/users/me`, { headers: { 'Authorization': `Bearer ${state.token}` } });
                if (res.ok) { state.user = await res.json();
                    updateAuthUI(); } else logout();
            } catch (err) { console.error('Error fetching user:', err); }
        }

        async function handleAuthSubmit(e) {
            e.preventDefault();
            const form = e.target;
            const data = Object.fromEntries(new FormData(form));
            try {
                if (state.authMode === 'login') {
                    const res = await fetch(`${API_URL}/users/login`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email: data.email, password: data.password })
                    });
                    if (!res.ok) { const err = await res.json();
                        throw new Error(err.detail || 'Login failed'); }
                    const result = await res.json();
                    state.token = result.access_token;
                    localStorage.setItem('blog_token', state.token);
                    await fetchCurrentUser();
                    closeAuthModal();
                    showToast('Welcome back!', 'success');
                    handleRoute();
                } else {
                    const res = await fetch(`${API_URL}/users/create`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(data)
                    });
                    if (!res.ok) { const err = await res.json();
                        throw new Error(err.detail || 'Registration failed'); }
                    showToast('Account created! Please login.', 'success');
                    toggleAuthMode();
                }
            } catch (err) { showToast(err.message, 'error'); }
        }

        async function createBlog(blogData) {
            try {
                const res = await fetch(`${API_URL}/blogs/`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${state.token}` },
                    body: JSON.stringify(blogData)
                });
                if (!res.ok) { const err = await res.json();
                    throw new Error(err.detail || 'Failed to create blog'); }
                showToast('Blog published successfully!', 'success');
                await fetchBlogs();
                navigateTo('my-blogs');
            } catch (err) { showToast(err.message, 'error'); }
        }

        function logout() {
            state.user = null;
            state.token = null;
            localStorage.removeItem('blog_token');
            updateAuthUI();
            showToast('Logged out successfully', 'info');
            const hash = window.location.hash.slice(1) || '';
            if (hash === 'my-blogs' || hash === 'profile' || hash === 'create-blog' || hash === 'dashboard') navigateTo('');
        }

        function updateAuthUI() {
            const container = document.getElementById('auth-section');
            const mobileAuth = document.getElementById('mobile-auth-links');
            if (state.user) {
                const initials = getInitials(state.user.first_name, state.user.last_name) || 'SA';
                const name = state.user.first_name || state.user.username;
                container.innerHTML = `
                    <div class="relative">
                        <button id="user-menu-btn" onclick="toggleUserMenu()" class="flex items-center space-x-2 focus:outline-none p-1 rounded-lg hover:bg-slate-200 dark:hover:bg-slate-800 transition-colors">
                            <div class="w-8 h-8 rounded-full bg-gradient-to-br from-teal-500 to-emerald-600 flex items-center justify-center text-white font-bold text-sm shadow-md">${initials}</div>
                            <span class="hidden sm:block text-sm font-medium">${name}</span>
                            <i class="fas fa-chevron-down text-xs text-slate-400"></i>
                        </button>
                        <div id="user-dropdown" class="dropdown-menu hidden absolute right-0 mt-2 w-52 bg-white dark:bg-slate-800 rounded-xl shadow-2xl border border-slate-200 dark:border-slate-700 py-2 z-50">
                            <div class="px-4 py-2 border-b border-slate-100 dark:border-slate-700 mb-1">
                                <p class="text-sm font-semibold">${state.user.first_name || ''} ${state.user.last_name || ''}</p>
                                <p class="text-xs text-slate-500 dark:text-slate-400 truncate">@${state.user.username}</p>
                            </div>
                            <a href="#profile" onclick="closeUserMenu()" class="flex items-center px-4 py-2 text-sm hover:bg-slate-100 dark:hover:bg-slate-700 transition-colors"><i class="fas fa-user w-5 text-slate-400"></i> Profile</a>
                            <a href="#dashboard" onclick="closeUserMenu()" class="flex items-center px-4 py-2 text-sm hover:bg-slate-100 dark:hover:bg-slate-700 transition-colors"><i class="fas fa-chart-pie w-5 text-slate-400"></i> Dashboard</a>
                            <a href="#my-blogs" onclick="closeUserMenu()" class="flex items-center px-4 py-2 text-sm hover:bg-slate-100 dark:hover:bg-slate-700 transition-colors"><i class="fas fa-newspaper w-5 text-slate-400"></i> My Blogs</a>
                            <a href="#create-blog" onclick="closeUserMenu()" class="flex items-center px-4 py-2 text-sm hover:bg-slate-100 dark:hover:bg-slate-700 transition-colors"><i class="fas fa-pen w-5 text-slate-400"></i> Create Blog</a>
                            <div class="border-t border-slate-100 dark:border-slate-700 my-1"></div>
                            <button onclick="logout(); closeUserMenu();" class="flex items-center w-full text-left px-4 py-2 text-sm text-red-500 hover:bg-slate-100 dark:hover:bg-slate-700 transition-colors"><i class="fas fa-sign-out-alt w-5"></i> Logout</button>
                        </div>
                    </div>`;

                                <div class="flex items-center justify-between text-xs text-slate-400 dark:text-slate-500 border-t border-slate-100 dark:border-slate-700 pt-4">
                                    <div class="flex items-center">
                                        <div class="w-6 h-6 rounded-full bg-gradient-to-br from-teal-400 to-emerald-400 flex items-center justify-center text-white text-[10px] font-bold mr-2">${getInitials(blog.author?.first_name, blog.author?.last_name) || 'SA'}</div>
                                        <span>${blog.author?.username || 'Sudais Azlan'}</span>
                                    </div>
                                    <span>${formatDate(blog.created_at)}</span>
                                </div>
                            </div>
                        </article>
                    `).join('')}
                </div>`;
        }

        function renderSkeletonGrid() {
            return `
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                    ${[1,2,3,4,5,6].map(() => `
                        <div class="bg-white dark:bg-slate-800 rounded-2xl overflow-hidden border border-slate-200 dark:border-slate-700">
                            <div class="h-48 skeleton"></div>
                            <div class="p-6">
                                <div class="h-6 skeleton rounded mb-3 w-3/4"></div>
                                <div class="h-4 skeleton rounded mb-2 w-full"></div>
                                <div class="h-4 skeleton rounded mb-2 w-5/6"></div>
                                <div class="h-4 skeleton rounded w-4/6"></div>
                            </div>
                        </div>
                    `).join('')}
                </div>`;
        }

        function renderEmptyState() {
            return `
                <div class="text-center py-20">
                    <div class="w-20 h-20 mx-auto mb-6 rounded-full bg-slate-100 dark:bg-slate-800 flex items-center justify-center"><i class="fas fa-inbox text-3xl text-slate-400"></i></div>
                    <h3 class="text-xl font-semibold mb-2">No blogs found</h3>
                    <p class="text-slate-500 dark:text-slate-400">The database is empty. Create your first blog!</p>
                    ${state.user ? `<a href="#create-blog" class="inline-block mt-4 px-6 py-3 rounded-lg bg-gradient-to-r from-teal-600 to-emerald-600 text-white font-medium hover:shadow-lg transition-all">Create Blog</a>` : ''}
                </div>`;
        }

        function openAuthModal() {
            document.getElementById('auth-modal').classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        }

        function closeAuthModal() {
            document.getElementById('auth-modal').classList.add('hidden');
            document.body.style.overflow = '';
        }

        function toggleAuthMode() {
            state.authMode = state.authMode === 'login' ? 'register' : 'login';
            const title = document.getElementById('auth-title');
            const submitBtn = document.getElementById('auth-submit-btn');
            const registerFields = document.getElementById('register-fields');
            const toggleText = document.getElementById('auth-toggle-text');
            const toggleBtn = document.getElementById('auth-toggle-btn');
            if (state.authMode === 'register') {
                title.textContent = 'Create Account';
                submitBtn.textContent = 'Register';
                registerFields.classList.remove('hidden');
                toggleText.textContent = 'Already have an account?';
                toggleBtn.textContent = 'Login';
            } else {
                title.textContent = 'Login';
                submitBtn.textContent = 'Login';
                registerFields.classList.add('hidden');
                toggleText.textContent = "Don't have an account?";
                toggleBtn.textContent = 'Register';
            }
        }

        function stripHtml(html) {
            if (!html) return '';
            const tmp = document.createElement('div');
            tmp.innerHTML = html.replace(/\`\`\`[\s\S]*?\`\`\`/g, '').replace(/\`[^\`]*\`/g, '');
            return tmp.textContent || tmp.innerText || '';
        }

        function formatDate(dateStr) {
            if (!dateStr) return 'Recently';
            const date = new Date(dateStr);
            return date.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
        }

        function getInitials(first, last) {
            return ((first?.[0] || '') + (last?.[0] || '')).toUpperCase() || 'SA';
        }

        function toggleMobileMenu() {
            document.getElementById('mobile-menu').classList.toggle('hidden');
        }

        function showToast(message, type = 'info') {
            const toast = document.createElement('div');
            const colors = { success: 'bg-emerald-500', error: 'bg-red-500', info: 'bg-teal-500' };
            toast.className =
                `fixed bottom-4 right-4 ${colors[type]} text-white px-6 py-3 rounded-xl shadow-2xl z-50 transform translate-y-10 opacity-0 transition-all duration-300 font-medium`;
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => toast.classList.remove('translate-y-10', 'opacity-0'), 100);
            setTimeout(() => { toast.classList.add('translate-y-10', 'opacity-0');
                setTimeout(() => toast.remove(), 300); }, 3000);
        }
