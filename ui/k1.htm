<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sudais Azlan - AI Blog Agent</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Playfair Display', 'serif'],
                    },
                    colors: {
                        primary: {
                            50: '#eef2ff',
                            100: '#e0e7ff',
                            200: '#c7d2fe',
                            300: '#a5b4fc',
                            400: '#818cf8',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                            800: '#3730a3',
                            900: '#312e81',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #6366f1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #4f46e5; }

        /* Markdown content styles */
        .blog-content h2 { font-size: 1.875rem; font-weight: 700; margin-top: 2.5rem; margin-bottom: 1rem; padding-bottom: 0.5rem; border-bottom: 2px solid #e2e8f0; }
        .dark .blog-content h2 { border-color: #334155; }
        .blog-content h3 { font-size: 1.5rem; font-weight: 600; margin-top: 2rem; margin-bottom: 0.75rem; color: #4338ca; }
        .dark .blog-content h3 { color: #818cf8; }
        .blog-content p { font-size: 1.125rem; line-height: 1.75; margin-bottom: 1.25rem; color: #475569; }
        .dark .blog-content p { color: #94a3b8; }
        .blog-content strong { color: #0f172a; font-weight: 700; }
        .dark .blog-content strong { color: #f1f5f9; }
        .blog-content table { width: 100%; border-collapse: collapse; margin: 1.5rem 0; border-radius: 0.5rem; overflow: hidden; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
        .blog-content th { background: linear-gradient(to right, #4f46e5, #7c3aed); color: white; padding: 1rem; text-align: left; font-weight: 600; }
        .blog-content td { padding: 1rem; border-bottom: 1px solid #e2e8f0; background: white; }
        .dark .blog-content td { background: #1e293b; border-color: #334155; }
        .blog-content tr:hover td { background: #f8fafc; }
        .dark .blog-content tr:hover td { background: #334155; }
        .blog-content blockquote { border-left: 4px solid #6366f1; padding: 1rem 1.5rem; margin: 1.5rem 0; background: #f8fafc; font-style: italic; border-radius: 0 0.5rem 0.5rem 0; }
        .dark .blog-content blockquote { background: #1e293b; }
        .blog-content ul, .blog-content ol { padding-left: 1.5rem; margin-bottom: 1.25rem; }
        .blog-content li { margin-bottom: 0.5rem; color: #475569; }
        .dark .blog-content li { color: #94a3b8; }
        .blog-content code { background: #f1f5f9; padding: 0.25rem 0.5rem; border-radius: 0.25rem; font-family: 'Courier New', monospace; font-size: 0.875rem; color: #dc2626; }
        .dark .blog-content code { background: #334155; color: #f87171; }
        .blog-content pre { background: #0f172a; color: #e2e8f0; padding: 1.5rem; border-radius: 0.75rem; overflow-x: auto; margin: 1.5rem 0; }
        .blog-content pre code { background: transparent; color: inherit; padding: 0; }
        .blog-content hr { margin: 2.5rem 0; border: 0; height: 2px; background: linear-gradient(to right, transparent, #6366f1, transparent); }
        .blog-content a { color: #4f46e5; text-decoration: underline; }
        .dark .blog-content a { color: #818cf8; }
        .blog-content img { max-width: 100%; border-radius: 0.75rem; margin: 1.5rem 0; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); }

        /* Animations */
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.6s ease-out forwards; }
        .delay-100 { animation-delay: 0.1s; }
        .delay-200 { animation-delay: 0.2s; }
        .delay-300 { animation-delay: 0.3s; }

        /* Glassmorphism */
        .glass { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(255, 255, 255, 0.3); }
        .dark .glass { background: rgba(15, 23, 42, 0.7); border-bottom: 1px solid rgba(255, 255, 255, 0.05); }

        /* Gradient text */
        .gradient-text { background: linear-gradient(135deg, #4f46e5, #7c3aed, #db2777); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }

        /* Card hover */
        .blog-card { transition: all 0.3s ease; }
        .blog-card:hover { transform: translateY(-8px); box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04); }

        /* Skeleton loading */
        .skeleton { background: linear-gradient(90deg, #e2e8f0 25%, #f1f5f9 50%, #e2e8f0 75%); background-size: 200% 100%; animation: skeleton 1.5s infinite; }
        .dark .skeleton { background: linear-gradient(90deg, #334155 25%, #475569 50%, #334155 75%); background-size: 200% 100%; }
        @keyframes skeleton { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

        /* Line clamp */
        .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .line-clamp-3 { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    </style>
<base target="_blank">
</head>
<body class="font-sans antialiased bg-slate-50 dark:bg-slate-900 text-slate-900 dark:text-slate-100 transition-colors duration-300">

            <div class="flex justify-between h-16 items-center">
                <div class="flex items-center cursor-pointer" onclick="navigateTo('')">
                    <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center text-white font-bold text-xl mr-3 shadow-lg">
                        S
                    </div>
                    <span class="text-xl font-bold gradient-text">Sudais Azlan</span>
                </div>

                <div class="hidden md:flex items-center space-x-8">
                    <a href="#blogs" class="nav-link text-sm font-medium hover:text-indigo-500 transition-colors">All Blogs</a>
                    <a href="#my-blogs" class="nav-link text-sm font-medium hover:text-indigo-500 transition-colors">My Blogs</a>

        <!-- Mobile menu -->
        <div id="mobile-menu" class="hidden md:hidden glass border-t border-slate-200 dark:border-slate-800">
            <div class="px-4 pt-2 pb-4 space-y-1">
                <a href="#blogs" class="block px-3 py-2 rounded-md text-base font-medium hover:bg-slate-200 dark:hover:bg-slate-800">All Blogs</a>
                <a href="#my-blogs" class="block px-3 py-2 rounded-md text-base font-medium hover:bg-slate-200 dark:hover:bg-slate-800">My Blogs</a>

    <!-- Main Content -->
    <main id="app" class="pt-16 min-h-screen">
        <!-- Content injected here -->
    </main>

    <!-- Footer -->
    <footer class="bg-white dark:bg-slate-900 border-t border-slate-200 dark:border-slate-800 mt-20">
        <div class="max-w-7xl mx-auto px-4 py-12 sm:px-6 lg:px-8">
            <div class="flex flex-col md:flex-row justify-between items-center">
                <div class="flex items-center mb-4 md:mb-0">
                    <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center text-white font-bold mr-2">
                        S
                    </div>
                    <span class="text-lg font-bold gradient-text">Sudais Azlan</span>
                </div>
                <div class="flex space-x-6 text-slate-500 dark:text-slate-400">
                    <a href="#" class="hover:text-indigo-500 transition-colors"><i class="fab fa-github text-xl"></i></a>
                    <a href="#" class="hover:text-indigo-500 transition-colors"><i class="fab fa-twitter text-xl"></i></a>
                    <a href="#" class="hover:text-indigo-500 transition-colors"><i class="fab fa-linkedin text-xl"></i></a>
                </div>
            </div>
            <div class="mt-8 text-center text-sm text-slate-500 dark:text-slate-500">
                &copy; Sudais Azlan. All rights reserved. Built with AI Blog Agent.
            </div>
        </div>
    </footer>

    <!-- Auth Modal -->
    <div id="auth-modal" class="fixed inset-0 z-[60] hidden">
        <div class="absolute inset-0 bg-black/50 backdrop-blur-sm" onclick="closeAuthModal()"></div>
        <div class="relative min-h-screen flex items-center justify-center p-4">
            <div class="bg-white dark:bg-slate-800 rounded-2xl shadow-2xl w-full max-w-md p-8 transform transition-all">
                <div class="flex justify-between items-center mb-6">
                    <h2 id="auth-title" class="text-2xl font-bold gradient-text">Login</h2>
                    <button onclick="closeAuthModal()" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200">
                        <i class="fas fa-times text-xl"></i>
                    </button>
                </div>

                <form id="auth-form" onsubmit="handleAuthSubmit(event)">
                    <div id="register-fields" class="hidden space-y-4">
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-medium mb-1">First Name</label>
                                <input type="text" name="first_name" class="w-full px-4 py-2 rounded-lg border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-700 focus:ring-2 focus:ring-indigo-500 outline-none transition-all">
                            </div>
                            <div>
                                <label class="block text-sm font-medium mb-1">Last Name</label>
                                <input type="text" name="last_name" class="w-full px-4 py-2 rounded-lg border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-700 focus:ring-2 focus:ring-indigo-500 outline-none transition-all">
                            </div>
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-1">Username</label>
                            <input type="text" name="username" class="w-full px-4 py-2 rounded-lg border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-700 focus:ring-2 focus:ring-indigo-500 outline-none transition-all">
                        </div>
                    </div>

                    <div class="space-y-4 mt-4">
                        <div>
                            <label class="block text-sm font-medium mb-1">Email</label>
                            <input type="email" name="email" required class="w-full px-4 py-2 rounded-lg border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-700 focus:ring-2 focus:ring-indigo-500 outline-none transition-all">
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-1">Password</label>
                            <input type="password" name="password" required class="w-full px-4 py-2 rounded-lg border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-700 focus:ring-2 focus:ring-indigo-500 outline-none transition-all">
                        </div>
                    </div>

                    <button type="submit" id="auth-submit-btn" class="w-full mt-6 py-3 rounded-lg bg-gradient-to-r from-indigo-600 to-purple-600 text-white font-semibold hover:shadow-lg transform hover:-translate-y-0.5 transition-all">
                        Login
                    </button>
                </form>

                <p class="mt-4 text-center text-sm text-slate-500 dark:text-slate-400">
                    <span id="auth-toggle-text">Don't have an account?</span>
                    <button onclick="toggleAuthMode()" class="text-indigo-500 hover:text-indigo-400 font-medium ml-1">
                        <span id="auth-toggle-btn">Register</span>
                    </button>
                </p>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // CONFIGURATION
        // ==========================================
        const API_URL = 'http://127.0.0.1:8000';

        // ==========================================
        // STATE
        // ==========================================
        let state = {
            user: null,
            token: localStorage.getItem('blog_token'),
            blogs: [],
            theme: localStorage.getItem('blog_theme') || 'dark',
            authMode: 'login',
            loading: false
        };

        // ==========================================
        // INITIALIZATION
        // ==========================================
        document.addEventListener('DOMContentLoaded', () => {
            initTheme();
            if (state.token) {
                fetchCurrentUser();
            }
            fetchBlogs();
            handleRoute();
            window.addEventListener('hashchange', handleRoute);
        });

        // ==========================================
        // THEME
        // ==========================================
        function initTheme() {
            if (state.theme === 'dark') {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        }

        function toggleTheme() {
            state.theme = state.theme === 'dark' ? 'light' : 'dark';
            localStorage.setItem('blog_theme', state.theme);
            initTheme();
        }

        // ==========================================
        // ROUTING
        // ==========================================
        function navigateTo(route) {
            window.location.hash = route;
        }

        function handleRoute() {
            const hash = window.location.hash.slice(1) || '';
            const [route, ...params] = hash.split('/');
            const app = document.getElementById('app');

            window.scrollTo(0, 0);

            document.querySelectorAll('.nav-link').forEach(link => {
                link.classList.remove('text-indigo-500');
                if (link.getAttribute('href') === '#' + route) {
                    link.classList.add('text-indigo-500');
                }
            });

            if (route === 'blog' && params[0]) {
                renderSingleBlog(parseInt(params[0]), app);
            } else if (route === 'my-blogs') {
                renderMyBlogs(app);
            } else if (route === 'about') {
                renderAbout(app);
            } else {
                renderAllBlogs(app);
            }
        }

        // ==========================================
        // API CALLS
        // ==========================================
        async function fetchBlogs() {
            state.loading = true;
            try {
                const res = await fetch(`${API_URL}/blogs/`);
                if (!res.ok) throw new Error('Failed to fetch blogs');
                const data = await res.json();
                // Handle tuple response from your API (data,)
                state.blogs = Array.isArray(data) ? data : (Array.isArray(data[0]) ? data[0] : []);
            } catch (err) {
                console.error('Error fetching blogs:', err);
                showToast('Backend not connected - showing demo data', 'info');
                state.blogs = getDemoBlogs();
            }
            state.loading = false;
            // Re-render if on blogs page
            const hash = window.location.hash.slice(1) || '';
            if (!hash || hash === 'blogs' || hash === 'my-blogs') {
                handleRoute();
            }
        }

        async function fetchCurrentUser() {
            try {
                const res = await fetch(`${API_URL}/users/me`, {
                    headers: { 'Authorization': `Bearer ${state.token}` }
                });
                if (res.ok) {
                    state.user = await res.json();
                    updateAuthUI();
                } else {
                    logout();
                }
            } catch (err) {
                console.error('Error fetching user:', err);
            }
        }

        async function handleAuthSubmit(e) {
            e.preventDefault();
            const form = e.target;
            const data = Object.fromEntries(new FormData(form));

            try {
                if (state.authMode === 'login') {
                    const res = await fetch(`${API_URL}/users/login`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email: data.email, password: data.password })
                    });

                    if (!res.ok) {
                        const err = await res.json();
                        throw new Error(err.detail || 'Login failed');
                    }

                    const result = await res.json();
                    state.token = result.access_token;
                    localStorage.setItem('blog_token', state.token);
                    await fetchCurrentUser();
                    closeAuthModal();
                    showToast('Welcome back!', 'success');
                    handleRoute();
                } else {
                    const res = await fetch(`${API_URL}/users/create`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(data)
                    });

                    if (!res.ok) {
                        const err = await res.json();
                        throw new Error(err.detail || 'Registration failed');
                    }

                    showToast('Account created! Please login.', 'success');
                    toggleAuthMode();
                }
            } catch (err) {
                showToast(err.message, 'error');
            }
        }

        function logout() {
            state.user = null;
            state.token = null;
            localStorage.removeItem('blog_token');
            updateAuthUI();
            showToast('Logged out successfully', 'info');
            if (window.location.hash === '#my-blogs') {
                navigateTo('');
            }
        }

        // ==========================================
        // UI RENDERERS
        // ==========================================
        function updateAuthUI() {
            const container = document.getElementById('auth-section');
            if (state.user) {
                container.innerHTML = `
                    <div class="flex items-center space-x-3">
                        <span class="hidden sm:block text-sm font-medium">${state.user.first_name || state.user.username}</span>
                        <button onclick="logout()" class="px-4 py-2 rounded-lg bg-slate-200 dark:bg-slate-700 hover:bg-slate-300 dark:hover:bg-slate-600 text-sm font-medium transition-colors">
                            Logout
                        </button>
                    </div>
                `;
            } else {
                container.innerHTML = `
                    <button onclick="openAuthModal()" class="px-4 py-2 rounded-lg bg-gradient-to-r from-indigo-600 to-purple-600 text-white text-sm font-medium hover:shadow-lg transition-all">
                        Login
                    </button>
                `;
            }
        }

        function renderAllBlogs(container) {
            const blogs = state.blogs;
            container.innerHTML = `
                <div class="animate-fade-in">
                    <!-- Hero -->
                    <div class="relative overflow-hidden bg-gradient-to-br from-indigo-600 via-purple-600 to-pink-500 dark:from-indigo-900 dark:via-purple-900 dark:to-slate-900 text-white py-24">
                        <div class="absolute inset-0 bg-[url('data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iNjAiIGhlaWdodD0iNjAiIHZpZXdCb3g9IjAgMCA2MCA2MCIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj48ZyBmaWxsPSJub25lIiBmaWxsLXJ1bGU9ImV2ZW5vZGQiPjxnIGZpbGw9IiNmZmYiIGZpbGwtb3BhY2l0eT0iMC4xIj48cGF0aCBkPSJNMzYgMzRoLTJ2LTRoMnY0em0wLTZ2LTRoLTJ2NGgyem0tNiA2aC00djJoNHYtMnptMC02di00aC00djRoNHptLTYgNmg0djJoLTR2LTJ6bTAtNnYtNGgtNHY0aDR6Ii8+PC9nPjwvZz48L3N2Zz4=')] opacity-20"></div>
                        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 relative z-10 text-center">
                            <h1 class="text-5xl md:text-7xl font-bold mb-6 font-serif italic">AI Blog Agent</h1>
                            <p class="text-xl md:text-2xl text-indigo-100 max-w-2xl mx-auto mb-8">Discover insights on Deep Learning, AI, and Technology curated by Sudais Azlan</p>
                            <div class="flex justify-center space-x-4">
                                <a href="#about" class="px-8 py-3 rounded-full bg-white/20 backdrop-blur-sm hover:bg-white/30 transition-all font-medium border border-white/30">About Me</a>
                                <a href="#blogs" class="px-8 py-3 rounded-full bg-white text-indigo-600 hover:bg-indigo-50 transition-all font-medium shadow-lg">Explore Blogs</a>
                            </div>
                        </div>
                    </div>

                    <!-- Blogs Grid -->
                    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-16">
                        <div class="flex justify-between items-end mb-12">
                            <div>
                                <h2 class="text-3xl font-bold mb-2">Latest Articles</h2>
                                <p class="text-slate-500 dark:text-slate-400">Explore ${blogs.length} articles from our database</p>
                            </div>
                        </div>

                        ${state.loading ? renderSkeletonGrid() : (blogs.length === 0 ? renderEmptyState() : renderBlogGrid(blogs))}
                    </div>
                </div>
            `;
        }

        function renderMyBlogs(container) {
            if (!state.user) {
                container.innerHTML = `
                    <div class="min-h-[60vh] flex items-center justify-center animate-fade-in">
                        <div class="text-center">
                            <div class="w-20 h-20 mx-auto mb-6 rounded-full bg-slate-100 dark:bg-slate-800 flex items-center justify-center">
                                <i class="fas fa-lock text-3xl text-slate-400"></i>
                            </div>
                            <h2 class="text-2xl font-bold mb-2">Authentication Required</h2>
                            <p class="text-slate-500 dark:text-slate-400 mb-6">Please login to view your blogs</p>
                            <button onclick="openAuthModal()" class="px-6 py-3 rounded-lg bg-gradient-to-r from-indigo-600 to-purple-600 text-white font-medium hover:shadow-lg transition-all">
                                Login Now
                            </button>
                        </div>
                    </div>
                `;
                return;
            }

            const myBlogs = state.blogs.filter(b => b.author_id === state.user.id);

            container.innerHTML = `
                <div class="animate-fade-in max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-16">
                    <div class="mb-12">
                        <h2 class="text-3xl font-bold mb-2">My Blogs</h2>
                        <p class="text-slate-500 dark:text-slate-400">You have created ${myBlogs.length} article${myBlogs.length !== 1 ? 's' : ''}</p>
                    </div>

                    ${myBlogs.length === 0 ? `
                        <div class="text-center py-20">
                            <div class="w-20 h-20 mx-auto mb-6 rounded-full bg-slate-100 dark:bg-slate-800 flex items-center justify-center">
                                <i class="fas fa-pen text-3xl text-slate-400"></i>
                            </div>
                            <h3 class="text-xl font-semibold mb-2">No blogs yet</h3>
                            <p class="text-slate-500 dark:text-slate-400">Start writing your first article!</p>
                        </div>
                    ` : renderBlogGrid(myBlogs)}
                </div>
            `;
        }

        function stripHtml(html) {
            if (!html) return '';
            const tmp = document.createElement('div');
            tmp.innerHTML = html.replace(/\`\`\`[\s\S]*?\`\`\`/g, '').replace(/\`[^\`]*\`/g, '');
            return tmp.textContent || tmp.innerText || '';
        }

        function formatDate(dateStr) {

        function showToast(message, type = 'info') {
            const toast = document.createElement('div');
            const colors = {
                success: 'bg-emerald-500',
                error: 'bg-red-500',
                info: 'bg-indigo-500'
            };
            toast.className = `fixed bottom-4 right-4 ${colors[type]} text-white px-6 py-3 rounded-xl shadow-2xl z-50 transform translate-y-10 opacity-0 transition-all duration-300 font-medium`;
            toast.textContent = message;
            document.body.appendChild(toast);

            setTimeout(() => {
                toast.classList.remove('translate-y-10', 'opacity-0');
            }, 100);

            setTimeout(() => {
                toast.classList.add('translate-y-10', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

                    content: "# Deep Learning Demystified: From Fundamentals to Enterprise Deployment\n\nDeep learning powers today's most impressive artificial intelligence applications—from autonomous vehicles to conversational agents. Yet the terminology can be confusing: Is it a distinct algorithm, a type of neural network, or merely a buzzword? This article explains the core concepts, shows how deep learning works in practice, and outlines the benefits, challenges, and best‑practice guidelines that data scientists, developers, and business leaders should follow.\n\n## Key Takeaways\n\n- Deep learning is a **subset of machine learning** that uses multilayer neural networks to learn complex patterns directly from large volumes of data.\n- It automatically discovers **abstract representations** without manual feature engineering.\n- Modern deep learning models often contain **hundreds of layers**, enabling them to capture intricate relationships.\n- The approach excels with **unstructured data** (images, audio, text) and benefits from **GPU/TPU acceleration**.\n- While powerful, deep learning demands **large labeled datasets**, significant computational resources, and careful attention to bias and interpretability.\n\n## Core Concept\n\n### What Is Deep Learning?\n\nDeep learning refers to a family of machine‑learning techniques that employ **deep neural networks**—networks with many hidden layers—to learn hierarchical representations of data. Unlike classical algorithms that rely on handcrafted features, deep learning models automatically extract features from raw inputs.\n\n### Core Components\n\n| Component | Purpose | Example |\n|-----------|---------|---------|\n| **Input Layer** | Receives raw data (pixels, audio samples, text tokens) | Image pixels, speech waveform |\n| **Hidden Layers** | Transform data through weighted connections, progressively extracting higher‑level features | Edge detectors → object parts → whole objects |\n| **Output Layer** | Produces the final prediction or classification | Class label, probability distribution |\n\nDeep learning models typically contain **four or more hidden layers**, and many modern architectures boast hundreds of layers, enabling them to capture intricate relationships that simpler models cannot.\n\n## How It Works\n\n1. **Data ingestion** – Raw data is fed into the input layer.\n2. **Forward pass** – Each layer applies a mathematical operation (e.g., convolution, matrix multiplication) and passes the result to the next layer.\n3. **Loss calculation** – The output is compared to the ground truth, and a loss value is computed.\n4. **Back‑propagation** – Gradients of the loss with respect to each weight are calculated and propagated backward.\n5. **Weight update** – Optimizers (e.g., **Adam**, **SGD**) adjust the weights to minimize loss.\n6. **Iteration** – Steps 2–5 repeat over many epochs until the model converges.\n\n> **Note:** GPUs can process thousands of parallel operations, dramatically reducing training time.\n\n## Technology & Component Grid\n\n| Component | Purpose | Example |\n|-----------|---------|---------|\n| **Convolutional Neural Network (CNN)** | Image‑centric feature extraction | Image classification, object detection |\n| **Recurrent Neural Network (RNN)** | Sequential data modeling | Speech‑to‑text, time‑series prediction |\n| **Transformer** | Attention‑based sequence processing | Machine translation, chatbots |\n| **Generative Adversarial Network (GAN)** | Generative modeling via adversarial training | Image synthesis, data augmentation |\n| **Diffusion Model** | Iterative denoising for generation | High‑fidelity image creation |\n\n## Comparison: Traditional Machine Learning vs. Deep Learning\n\n| Feature | Traditional ML | Deep Learning |\n|---------|----------------|---------------|\n| **Feature engineering** | Manual extraction | Automatic learning |\n| **Data type** | Structured, tabular | Unstructured (images, audio, text) |\n| **Pre‑processing** | Extensive cleaning | Minimal; raw data often accepted |\n| **Model complexity** | Simple models (linear regression, decision trees) | Complex, multilayer networks |\n| **Hardware requirements** | CPU‑friendly | GPU/TPU‑optimized |\n| **Interpretability** | Generally more interpretable | Often a black box |",
